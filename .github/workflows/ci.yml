name: Project checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: internet-provider-order-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests -q
  local-assistant:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: local-document-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v
      - name: Package source for review
        uses: actions/upload-artifact@v4
        with:
          name: local-assistant-source
          path: |
            local-document-assistant/*.py
            local-document-assistant/README.md
            local-document-assistant/requirements.txt
